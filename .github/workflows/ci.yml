name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly run so newly published vulnerabilities surface via govulncheck
    # even when nothing is being pushed.
    - cron: "0 6 * * 1"
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Supersede stale PR/branch runs, but never cancel a run that is gating a
  # release (workflow_call from release.yml shares the tag ref).
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

jobs:
  # systray needs cgo on darwin and has windows-only files (registry, icon),
  # so lint/test natively on the two release targets. Linux isn't shipped and
  # would need GTK headers just to type-check, so it's skipped.
  lint:
    name: lint (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: go mod tidy
        shell: bash
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - uses: golangci/golangci-lint-action@v9
        with:
          # Keep in sync with the version used by the local pre-commit hook.
          version: v2.14.0

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -race -shuffle=on ./...

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
