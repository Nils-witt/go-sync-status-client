name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Don't publish a tag that fails lint/tests/govulncheck.
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    name: build (${{ matrix.goos }}/${{ matrix.goarch }})
    needs: ci
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # darwin needs the macOS SDK (Objective-C) for systray's cgo
          # bindings; Xcode on macos-latest cross-compiles both arches.
          - goos: darwin
            goarch: amd64
            runner: macos-latest
            cgo: "1"
          - goos: darwin
            goarch: arm64
            runner: macos-latest
            cgo: "1"
          # windows has no cgo in systray, so it's a pure Go cross-compile
          # from any host.
          - goos: windows
            goarch: amd64
            runner: ubuntu-latest
            cgo: "0"
          - goos: windows
            goarch: arm64
            runner: ubuntu-latest
            cgo: "0"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: build --single-target --clean
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: ${{ matrix.cgo }}

      - name: Archive
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          bin_dir="$(find dist -mindepth 1 -maxdepth 1 -type d)"
          name="go-sync-status-client_${GITHUB_REF_NAME}_${GOOS}_${GOARCH}"
          mkdir -p release
          if [ "$GOOS" = "windows" ]; then
            (cd "$bin_dir" && zip -r "../../release/${name}.zip" .)
          else
            tar -C "$bin_dir" -czf "release/${name}.tar.gz" .
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: build-${{ matrix.goos }}-${{ matrix.goarch }}
          path: release/*
          if-no-files-found: error
          retention-days: 1

  release:
    name: release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: release
          pattern: build-*
          merge-multiple: true

      - name: Checksums
        working-directory: release
        run: sha256sum * > checksums.txt

      - uses: softprops/action-gh-release@v3
        with:
          files: release/*
          generate_release_notes: true
